name: Windows CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "**"
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"
      # ignore CI for other platforms
      - ".github/FUNDING.yml"
      - ".github/actions/**"
      - ".github/workflows/Android.yml"
      - ".github/workflows/CI-cache-cleanup.yml"
      - ".github/workflows/docs-test.yml"
      - ".github/workflows/gh-pages-docs.yml"
      - ".github/workflows/iOS.yml"
      - ".github/workflows/Linux.yml"
      - ".github/workflows/macOS.yml"
      - ".github/workflows/source-tarball.yml"
      - ".github/workflows/WASM.yml"
      - "cmake/presets/Android.json"
      - "cmake/presets/iOS.json"
      - "cmake/presets/Linux.json"
      - "cmake/presets/macOS.json"
      - "cmake/presets/WASM.json"

  pull_request:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"
      # ignore CI for other platforms
      - ".github/FUNDING.yml"
      - ".github/actions/**"
      - ".github/workflows/Android.yml"
      - ".github/workflows/CI-cache-cleanup.yml"
      - ".github/workflows/docs-test.yml"
      - ".github/workflows/gh-pages-docs.yml"
      - ".github/workflows/iOS.yml"
      - ".github/workflows/Linux.yml"
      - ".github/workflows/macOS.yml"
      - ".github/workflows/source-tarball.yml"
      - ".github/workflows/WASM.yml"
      - "cmake/presets/Android.json"
      - "cmake/presets/iOS.json"
      - "cmake/presets/Linux.json"
      - "cmake/presets/macOS.json"
      - "cmake/presets/WASM.json"

concurrency:
  # cancel jobs on PRs only
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  id-token: write # needed for AWS

jobs:
  build-and-test:
    name: Build (Qt${{ matrix.qt_version }}, ${{ matrix.renderer }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - qt_version: 6.11.2
            qt_arch: win64_msvc2022_64
            runner: windows-2025
            arch: msvc2022_64
            compiler: x64
            preset: Windows-OpenGL-sccache
            renderer: OpenGL
          - qt_version: 6.11.2
            qt_arch: win64_msvc2022_arm64
            runner: windows-11-arm
            arch: msvc2022_arm64
            compiler: arm64
            preset: Windows-OpenGL-sccache-no-tests
            renderer: OpenGL
          - qt_version: 6.11.2
            qt_arch: win64_msvc2022_64
            runner: windows-2025
            arch: msvc2022_64
            compiler: x64
            preset: Windows-Vulkan-sccache-no-tests
            renderer: Vulkan
          - qt_version: 6.11.2
            qt_arch: win64_msvc2022_arm64
            runner: windows-11-arm
            arch: msvc2022_arm64
            compiler: arm64
            preset: Windows-Vulkan-sccache-no-tests
            renderer: Vulkan

    env:
      PRESET: ${{ matrix.preset }}

    steps:
      - name: Configure AWS Credentials
        if: vars.OIDC_AWS_ROLE_TO_ASSUME
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Install sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Pin for reproducibility
          $version = "v0.16.0"

          # Map your matrix arch to sccache release artifact arch
          $targetArch = "${{ matrix.arch }}"
          if ($targetArch -eq "msvc2022_arm64") {
            $artifactArch = "aarch64-pc-windows-msvc"
          } else {
            $artifactArch = "x86_64-pc-windows-msvc"
          }

          $zipName = "sccache-$version-$artifactArch.zip"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$zipName"

          $tmpZip = Join-Path $env:RUNNER_TEMP $zipName
          $outDir = Join-Path $env:RUNNER_TEMP "sccache-bin"

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $tmpZip
          Expand-Archive -Path $tmpZip -DestinationPath $outDir -Force

          # Find folder containing sccache.exe
          $exe = Get-ChildItem -Path $outDir -Recurse -Filter "sccache.exe" | Select-Object -First 1
          if (-not $exe) { throw "sccache.exe not found after extraction" }

          $binDir = $exe.Directory.FullName
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          & (Join-Path $binDir "sccache.exe") --version

      - name: Configure sccache
        shell: bash
        run: |
          sccache --version

          {
            echo "SCCACHE_BUCKET=maplibre-native-sccache"
            echo "SCCACHE_REGION=eu-central-1"
          } >> "$GITHUB_ENV"
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "AWS_SECRET_ACCESS_KEY not set; not uploading sccache cache to S3"
            echo "SCCACHE_S3_NO_CREDENTIALS=1" >> "$GITHUB_ENV"
          fi

      - name: Enable git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Download Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: ${{ matrix.qt_version }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtlocation qtpositioning

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 4.4.x

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.compiler }}
          toolset: 14.44

      - name: Build
        shell: bash
        working-directory: source
        run: |
          cmake --workflow --preset ${PRESET}

      - name: Install
        shell: bash
        run: |
          mkdir install && cd install
          tar xf ../build/qt6-Windows-${{ matrix.renderer }}/maplibre-native-qt_*.tar.bz2
          mv maplibre-native-qt_* maplibre-native-qt

      - name: Build QtQuick Example
        shell: bash
        working-directory: source/examples/quick
        run: |
          export QMapLibre_DIR="$GITHUB_WORKSPACE/install/maplibre-native-qt"
          cmake --workflow --preset default

      - name: Build QtQuick Standalone Example
        shell: bash
        working-directory: source/examples/quick-standalone
        run: |
          export QMapLibre_DIR="$GITHUB_WORKSPACE/install/maplibre-native-qt"
          cmake --workflow --preset default

      - name: Build QtWidgets Example
        shell: bash
        working-directory: source/examples/widgets
        run: |
          export QMapLibre_DIR="$GITHUB_WORKSPACE/install/maplibre-native-qt"
          cmake --workflow --preset default

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload installation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows_${{ matrix.arch }}_${{ matrix.qt_version }}_${{ matrix.renderer }}
          path: build/qt6-Windows-${{ matrix.renderer }}/maplibre-native-qt_*.tar.bz2

      - name: Upload examples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows_${{ matrix.arch }}_${{ matrix.qt_version }}_${{ matrix.renderer }}_examples
          path: build/qt6-example-*/*.tar.bz2

  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: windows-2025
    needs: build-and-test
    permissions:
      contents: write
    strategy:
      matrix:
        qt_version: [6.11.2]
        arch: [msvc2022_64, msvc2022_arm64]
        renderer: [OpenGL, Vulkan]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Windows_${{ matrix.arch }}_${{ matrix.qt_version }}_${{ matrix.renderer }}

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: maplibre-native-qt_${{ github.ref_name }}_Qt${{ matrix.qt_version }}_Windows_${{ matrix.renderer }}.tar.bz2
          allowUpdates: true
          draft: true
