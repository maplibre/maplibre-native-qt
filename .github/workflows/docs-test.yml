name: Docs Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "**"
    paths:
      - "src/**"
      - "docs/**"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "docs/**"

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Doxygen
        uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758 # v2.0.3
        with:
          version: "1.12.0"

      - name: Install doxyqml
        run: pip install doxyqml

      - name: Generate documentation
        working-directory: docs
        run: doxygen
