name: iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "**"
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"
      # ignore CI for other platforms
      - ".github/FUNDING.yml"
      - ".github/actions/**"
      - ".github/workflows/Android.yml"
      - ".github/workflows/CI-cache-cleanup.yml"
      - ".github/workflows/docs-test.yml"
      - ".github/workflows/gh-pages-docs.yml"
      - ".github/workflows/Linux.yml"
      - ".github/workflows/macOS.yml"
      - ".github/workflows/source-tarball.yml"
      - ".github/workflows/WASM.yml"
      - ".github/workflows/Windows.yml"
      - "cmake/presets/Android.json"
      - "cmake/presets/Linux.json"
      - "cmake/presets/macOS.json"
      - "cmake/presets/WASM.json"
      - "cmake/presets/Windows.json"

  pull_request:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "docs/**"
      # ignore CI for other platforms
      - ".github/FUNDING.yml"
      - ".github/actions/**"
      - ".github/workflows/Android.yml"
      - ".github/workflows/CI-cache-cleanup.yml"
      - ".github/workflows/docs-test.yml"
      - ".github/workflows/gh-pages-docs.yml"
      - ".github/workflows/Linux.yml"
      - ".github/workflows/macOS.yml"
      - ".github/workflows/source-tarball.yml"
      - ".github/workflows/WASM.yml"
      - ".github/workflows/Windows.yml"
      - "cmake/presets/Android.json"
      - "cmake/presets/Linux.json"
      - "cmake/presets/macOS.json"
      - "cmake/presets/WASM.json"
      - "cmake/presets/Windows.json"

concurrency:
  # cancel jobs on PRs only
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (Qt${{ matrix.qt_version}})
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - qt_version: 6.11.2
            preset: iOS-ccache

    env:
      PRESET: ${{ matrix.preset }}

    steps:
      - name: Recover disk space
        run: |
          df -h
          ls /Applications
          brew uninstall google-chrome
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Applications/Xcode_14*
          sudo rm -rf /Applications/Xcode_15*
          ls /Applications
          df -h

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 4.4.x

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Download Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: ${{ matrix.qt_version }}
          target: ios
          modules: qtlocation qtpositioning

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: iOS_${{ matrix.qt_version }}
          max-size: 2500MB

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Build
        working-directory: source
        run: |
          export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../macos")"
          cmake --workflow --preset ${PRESET}

      - name: Upload installation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iOS_${{ matrix.qt_version }}
          path: build/qt6-iOS/maplibre-native-qt_*_iOS_Metal.tar.bz2

  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: macos-15
    needs: build
    permissions:
      contents: write
    strategy:
      matrix:
        qt_version: [6.11.2]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iOS_${{ matrix.qt_version }}

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: maplibre-native-qt_${{ github.ref_name }}_Qt${{ matrix.qt_version }}_iOS_Metal.tar.bz2
          allowUpdates: true
          draft: true
